[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sheap"
module-root = "."
source-exclude = [
    "sheap/SuportData/sfddata/*.fits",
]

[project]
name = "sheap"
version = "0.0.10"
description = "sheap: Spectral Handling and Estimation of AGN Parameters"
readme = "README.rst"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
authors = [
    { name = "Felipe Avila-Vera", email = "felipe.avilav@postgrado.uv.cl" },
]
maintainers = [
    { name = "Felipe Avila-Vera", email = "felipe.avilav@postgrado.uv.cl" },
]
keywords = [
    "python package",
]

dependencies = [
    # Core numerics
    "numpy>=2.0,<2.3",
    "pandas>=2.2",
    "scipy>=1.11",

    # Astronomy / plotting
    "astropy>=7.2",
    "matplotlib>=3.8",

    # JAX stack. Keep jax and jaxlib aligned.
    "jax==0.4.38",
    "jaxlib==0.4.38",
    "optax>=0.2.3,<0.3",

    # Utilities
    "tqdm>=4.66",
    "uncertainties>=3.1",

    # Dust maps
    "sfdmap2",

    # # Documentation notebooks currently imported by the docs build
    # "nbsphinx",
    # "myst-nb",
]


[project.scripts]
sheap = "sheap.cli:main"

[project.urls]
Homepage = "https://github.com/favila/sheap"
Repository = "https://github.com/favila/sheap"
Documentation = "https://sheap.readthedocs.io/"
"Bug Tracker" = "https://github.com/favila/sheap/issues"
"CI: Github Actions" = "https://github.com/favila/sheap/actions"
"Source Code" = "https://github.com/favila/sheap"
Changelog = "https://github.com/favila/sheap/blob/master/CHANGELOG.rst"
"Code of Conduct" = "https://github.com/favila/sheap/blob/master/CONTRIBUTING.rst"

[dependency-groups]
dev = [
    "tox>=4.55.0",
    "tox-uv>=1.35.2",
    "ruff",
    "mypy",
    "pytest",
]

test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-explicit>=1.0.1,<2.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-click>=1.1,<2.0",
    "pytest-run-subprocess>=0.10,<0.11",
    "coverage>=7.0,<8.0",
    "exceptiongroup>=1.1,<2.0",
]

typing = [
    "mypy>=1.8,<2.0",
    "types-requests",
    "types-PyYAML>=6.0.12.20250516",
    "pytest>=8.0,<9.0",
    "pytest-click>=1.1,<2.0",
]

docs = [
    "sphinx>=5.0,<8.3",
    "sphinx-autodoc-typehints>=1.10",
    "sphinx-rtd-theme>=1.2.0,<2.0",
    "sphinxcontrib-spelling~=7.3.3",
    "sphinx-inline-tabs>=2023.4.21; python_version >= '3.12' and python_version < '3.13'",
    "sphinxcontrib-mermaid>=0.9.2; python_version >= '3.12' and python_version < '3.13'",
    "furo",
    "nbsphinx",
    "myst-nb",
]

docslive = [
    { include-group = "docs" },
    "sphinx-autobuild>=2021.3.14,<2022.0",
]

notebooks = [
    "marimo",
    "ipykernel",
    "jupyterlab",
]

all = [
    { include-group = "dev" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "docs" },
    { include-group = "docslive" },
    { include-group = "notebooks" },
]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "--strict-markers"
markers = [
    "runner_setup: marks tests that require CLI runner setup",
    "slow: Marks a slow test",
    "integration: Integration Tests",
    "network_bound: Require internet connection",
]
testpaths = [
    "tests",
]
explicit-only = [
    "integration",
    "network_bound",
]

[tool.ruff]
line-length = 95

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.black]
line-length = 95
include = '\\.pyi?$'
extend-exclude = '''
'''

[tool.isort]
profile = "black"

[tool.bandit]
tests = []
skips = [
    "B101",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["optax.*", "jax.*", "astropy.*", "sfdmap2"]
ignore_missing_imports = true

[tool.software-release]
version_variable = "sheap/__init__.py:__version__"

